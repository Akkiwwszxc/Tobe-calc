name = "tobe-license"
main = "worker.js"
compatibility_date = "2026-11-22"

[vars]
# Төлем жүйесі: "kaspi" = клиент Kaspi-де сіздің нөміріңізге аударым жасайды, сіз /admin бетінде растайсыз.
# "test" = тестілік (нақты ақша жоқ).
PROVIDER = "kaspi"
# Kaspi: ақша түсетін нөміріңіз (клиентке көрсетіледі). Бос болса төлем «қосылмаған» деп көрінеді.
KASPI_PHONE = "+77057404688"
# Kaspi-де клиент аударым алдында көретін аты, мысалы "Асхат К." (міндетті емес, бірақ сенімділікті арттырады)
KASPI_NAME = "Акберен Д"
# Тестілік төлемге рұқсат. НАҒЫЗ САТЫЛЫМДА "0" болуы керек (Kaspi режимінде бұл параметр қолданылмайды).
ALLOW_TEST_PAYMENTS = "0"
# Баға пакеттері (price: теңге). Мына бағалар ҮЛГІ, өзіңіздікіне ауыстырыңыз.
PLANS = '[{"id":"m1","months":1,"price":25000,"title":"1 ай"},{"id":"m3","months":3,"price":60000,"title":"3 ай"},{"id":"m12","months":12,"price":100000,"title":"12 ай"}]'

[[kv_namespaces]]
binding = "ORDERS"
id = "__KV_ID__"

# 3D көру беті: public/index.html GitHub Actions арқылы www/index.html-ден көшіріледі.
# Сілтеме https://….workers.dev/?v=КОД осы бетті ашады.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
