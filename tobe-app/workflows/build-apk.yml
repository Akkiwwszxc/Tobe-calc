name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project folder
        id: p
        run: |
          F=$(find . -name capacitor.config.json -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$F" ]; then
            echo "::error::capacitor.config.json табылмады. package.json, capacitor.config.json және www папкасы репозиторийде болуы керек."
            echo "Repo contents:"; find . -not -path "./.git/*" -maxdepth 3
            exit 1
          fi
          D=$(dirname "$F")
          echo "dir=$D" >> "$GITHUB_OUTPUT"
          echo "Project folder: $D"
          ls -la "$D"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
        working-directory: ${{ steps.p.outputs.dir }}
      - run: npm run libs
        working-directory: ${{ steps.p.outputs.dir }}
      - run: npx cap add android
        working-directory: ${{ steps.p.outputs.dir }}
      - run: npx cap sync android
        working-directory: ${{ steps.p.outputs.dir }}
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: ${{ steps.p.outputs.dir }}/android
      - uses: actions/upload-artifact@v4
        with:
          name: tobe-apk
          path: ${{ steps.p.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
