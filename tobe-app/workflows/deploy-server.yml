name: Deploy license server
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["**/server/**", "server/**"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LICENSE_PRIVATE_JWK: ${{ secrets.LICENSE_PRIVATE_JWK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check secrets
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID LICENSE_PRIVATE_JWK; do
            if [ -z "${!v}" ]; then echo "::error::GitHub Secrets ішінде $v жоқ"; exit 1; fi
          done
      - name: Find server folder
        id: p
        run: |
          F=$(find . -name wrangler.toml -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$F" ]; then
            echo "::error::wrangler.toml табылмады. server папкасы (worker.js және wrangler.toml) репозиторийге жүктелмеген."
            echo "Repo contents:"; find . -not -path "./.git/*" -maxdepth 3
            exit 1
          fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"
          echo "Server folder: $(dirname "$F")"
      - name: Prepare KV namespace
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          getid() { npx --yes wrangler@4 kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const x=a.find(n=>n.title==="tobe-license-orders");console.log(x?x.id:"")})'; }
          ID=$(getid)
          if [ -z "$ID" ]; then
            npx --yes wrangler@4 kv namespace create tobe-license-orders
            ID=$(getid)
          fi
          if [ -z "$ID" ]; then echo "::error::KV namespace жасалмады"; exit 1; fi
          sed -i "s/__KV_ID__/$ID/" wrangler.toml
      - name: Deploy
        working-directory: ${{ steps.p.outputs.dir }}
        run: npx --yes wrangler@4 deploy
      - name: Set private key secret
        working-directory: ${{ steps.p.outputs.dir }}
        run: printf '%s' "$LICENSE_PRIVATE_JWK" | npx --yes wrangler@4 secret put LICENSE_PRIVATE_JWK
