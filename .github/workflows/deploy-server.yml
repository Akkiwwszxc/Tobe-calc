name: Deploy license server
on:
  workflow_dispatch:
  push:
    branches: [main]
    # server өзгерсе немесе қосымша беті (www/index.html) өзгерсе, 3D көру беті де жаңарады
    paths: ["**/server/**", "server/**", "**/www/index.html", "www/index.html"]
concurrency:
  group: deploy-license-server
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LICENSE_PRIVATE_JWK: ${{ secrets.LICENSE_PRIVATE_JWK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check secrets
        id: s
        run: |
          MISSING=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID LICENSE_PRIVATE_JWK; do
            if [ -z "${!v}" ]; then MISSING="$MISSING $v"; fi
          done
          if [ -n "$MISSING" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::GitHub Secrets ішінде жоқ:$MISSING (Settings → Secrets and variables → Actions → Repository secrets)"
              exit 1
            fi
            echo "::notice::Secrets әлі қойылмаған ($MISSING ), сервер орнату өткізілді. Secrets қойған соң Actions → Deploy license server → Run workflow басыңыз."
            echo "have=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "have=1" >> "$GITHUB_OUTPUT"

      - name: Check private key matches the app
        if: steps.s.outputs.have == '1'
        run: |
          cat > "$RUNNER_TEMP/chk.js" <<'EOF'
          const fs = require("fs");
          const { execSync } = require("child_process");
          let j;
          try { j = JSON.parse(process.env.LICENSE_PRIVATE_JWK); }
          catch (e) { console.log("::error::LICENSE_PRIVATE_JWK дұрыс JSON емес. private-key.jwk.json файлының БҮКІЛ мәтінін, ашатын және жабатын жақшаларымен қосып қойыңыз."); process.exit(1); }
          if (j.kty !== "EC" || j.crv !== "P-256" || !j.d) {
            console.log("::error::LICENSE_PRIVATE_JWK жеке кілт емес (d өрісі жоқ). Ашық кілтті (public-key.json) емес, private-key.jwk.json мәтінін қойыңыз.");
            process.exit(1);
          }
          const files = execSync("find . -name index.html -not -path '*/node_modules/*' -not -path './.git/*'").toString().split("\n").filter(Boolean);
          let pub = null;
          for (const f of files) {
            const m = fs.readFileSync(f, "utf8").match(/pub:\s*(\{[^}]*"kty"[^}]*\})/);
            if (m) { try { pub = JSON.parse(m[1]); console.log("Қосымшадағы ашық кілт табылды: " + f); break; } catch (e) {} }
          }
          if (!pub) console.log("::warning::index.html ішінде ашық кілт (pub) табылмады, сәйкестік тексерілмеді.");
          else if (pub.x !== j.x || pub.y !== j.y) { console.log("::error::LICENSE_PRIVATE_JWK қосымшадағы ашық кілтке сәйкес емес. Басқа кілт жұбы қойылған: сервер берген кілттерді қосымша қабылдамайды."); process.exit(1); }
          else console.log("Жеке кілт қосымшадағы ашық кілтке сәйкес ✓");
          EOF
          node "$RUNNER_TEMP/chk.js"

      - name: Find server folder
        id: p
        if: steps.s.outputs.have == '1'
        run: |
          F=$(find . -name wrangler.toml -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$F" ]; then
            echo "::error::wrangler.toml табылмады. server папкасы (worker.js және wrangler.toml) репозиторийге жүктелмеген."
            echo "Repo contents:"; find . -not -path "./.git/*" -maxdepth 3
            exit 1
          fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"
          echo "Server folder: $(dirname "$F")"

      - name: Copy app as 3D viewer page
        if: steps.s.outputs.have == '1'
        run: |
          APP=$(find . -path "*/www/index.html" -not -path "*/node_modules/*" -not -path "./.git/*" | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::www/index.html табылмады: 3D көру беті жасалмайды."
            exit 1
          fi
          mkdir -p "${{ steps.p.outputs.dir }}/public"
          cp "$APP" "${{ steps.p.outputs.dir }}/public/index.html"
          echo "Көру беті: $APP → ${{ steps.p.outputs.dir }}/public/index.html"

      - name: Check Cloudflare access
        if: steps.s.outputs.have == '1'
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          if ! npx --yes wrangler@4 whoami; then
            echo "::error::Cloudflare-ға кіру мүмкін болмады. CLOUDFLARE_API_TOKEN дұрыс па? Токен «Edit Cloudflare Workers» үлгісімен жасалуы және Workers KV Storage: Edit рұқсаты болуы керек."
            exit 1
          fi

      - name: Prepare KV namespace
        if: steps.s.outputs.have == '1'
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          cat > "$RUNNER_TEMP/kvid.js" <<'EOF'
          let s = "";
          process.stdin.on("data", d => s += d).on("end", () => {
            try {
              const a = JSON.parse(s.slice(s.indexOf("["), s.lastIndexOf("]") + 1));
              const x = a.find(n => n.title === "tobe-license-orders");
              console.log(x ? x.id : "");
            } catch (e) { console.log(""); }
          });
          EOF
          getid() { npx --yes wrangler@4 kv namespace list 2>/dev/null | node "$RUNNER_TEMP/kvid.js"; }
          ID=$(getid)
          if [ -z "$ID" ]; then
            npx --yes wrangler@4 kv namespace create tobe-license-orders
            ID=$(getid)
          fi
          if [ -z "$ID" ]; then echo "::error::KV namespace жасалмады немесе табылмады. Токенде Workers KV Storage: Edit рұқсаты бар ма?"; exit 1; fi
          echo "KV namespace id: $ID"
          sed -i "s/__KV_ID__/$ID/" wrangler.toml

      - name: Deploy
        id: dep
        if: steps.s.outputs.have == '1'
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          set +e
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            if grep -qi "subdomain" deploy.log; then
              echo "::error::workers.dev subdomain әлі тіркелмеген. Cloudflare Dashboard → Workers & Pages бөлімін ашып, subdomain атын таңдаңыз (бір рет), сосын осы жұмысты қайта іске қосыңыз."
            fi
            exit "$RC"
          fi
          URL=$(grep -o 'https://[A-Za-z0-9._-]*\.workers\.dev' deploy.log | head -n 1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Worker URL: $URL"

      - name: Set private key secret
        if: steps.s.outputs.have == '1'
        working-directory: ${{ steps.p.outputs.dir }}
        run: printf '%s' "$LICENSE_PRIVATE_JWK" | npx --yes wrangler@4 secret put LICENSE_PRIVATE_JWK

      - name: Smoke test and show address
        if: steps.s.outputs.have == '1'
        run: |
          URL="${{ steps.dep.outputs.url }}"
          if [ -z "$URL" ]; then
            echo "::warning::workers.dev мекенжайы автоматты табылмады. Жоғарыдағы Deploy логынан https://….workers.dev жолын қараңыз."
            exit 0
          fi
          OK=""
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL/plans" -o plans.json; then OK=1; break; fi
            sleep 5
          done
          if [ -z "$OK" ]; then echo "::error::Сервер жауап бермеді: $URL/plans"; exit 1; fi
          echo "Сервер жауабы:"; cat plans.json; echo
          if curl -fsS "$URL/" | grep -qi "<html"; then VIEW="жұмыс істейді"; else VIEW="ЖАУАП ЖОҚ (беттің көшірмесін тексеріңіз)"; fi
          {
            printf '## ✅ Лицензия сервері орнатылды\n\n'
            printf 'Мекенжай: `%s`\n\n' "$URL"
            printf 'www/index.html ішіндегі лицензия блогына қойыңыз:\n\n'
            printf '    api: "%s",\n\n' "$URL"
            printf 'Режим: `%s`\n\n' "$(node -e 'const j=require("./plans.json");console.log(j.mode)')"
            printf '3D көру беті: %s\n' "$VIEW"
          } >> "$GITHUB_STEP_SUMMARY"
